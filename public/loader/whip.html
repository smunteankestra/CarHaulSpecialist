<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>Dubly Whip Crack Loader</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&amp;family=Fredoka+One&amp;family=Nunito:wght@700;900&amp;display=swap" rel="stylesheet"/>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080c16;
      font-family: 'Nunito', sans-serif;
    }

    :root {
      --cycle-time: 2.4s;
    }

    /* ---- layout (replaces the Tailwind utility classes) ---- */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      position: relative;
    }
    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(49, 46, 129, 0.7) 0%, #020617 60%, #020617 100%);
    }
    .screen-flash {
      position: fixed;
      inset: 0;
      background: #fcd34d;
      pointer-events: none;
      z-index: 40;
      mix-blend-mode: screen;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1024px;
      max-height: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      z-index: 10;
    }
    .stage-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.8));
    }

    /* Spinner Orbit Animations */
    @keyframes spin-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-ccw {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      45% { transform: scale(1.06); opacity: 0.7; }
    }
    .ring-spin-cw {
      animation: spin-cw 10s linear infinite;
    }
    .ring-spin-ccw {
      animation: spin-ccw 6s linear infinite;
    }
    .pulse-glow-ring {
      animation: pulse-ring var(--cycle-time) ease-in-out infinite;
    }

    /* Dramatic Screen Shake on impact */
    @keyframes screen-quake {
      0%, 42% { transform: translate(0, 0); }
      43.5% { transform: translate(-8px, 6px) rotate(-1deg); }
      45% { transform: translate(10px, -7px) rotate(1.2deg); }
      47% { transform: translate(-7px, 5px) rotate(-0.7deg); }
      49% { transform: translate(5px, -3px) rotate(0.4deg); }
      52% { transform: translate(-2px, 1px); }
      55%, 100% { transform: translate(0, 0); }
    }
    .screen-shake-layer {
      animation: screen-quake var(--cycle-time) cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
      transform-origin: center center;
    }

    /* Dubly squash & stretch, impact recoil and dazed recovery */
    @keyframes dubly-whip-reaction {
      0%, 20% {
        /* Confident, cheerful idle */
        transform: translate(0, 0) scale(1, 1) rotate(0deg);
      }
      30% {
        /* Wind-up notice: glances up, slight lean right */
        transform: translate(10px, -4px) scale(0.98, 1.04) rotate(3deg);
      }
      38% {
        /* Dread anticipation: cowering & squashing down */
        transform: translate(24px, 16px) scale(1.12, 0.86) rotate(8deg);
      }
      43.5% {
        /* INSTANT IMPACT SHOCK - violently flung back & compressed */
        transform: translate(-48px, -18px) scale(1.3, 0.7) rotate(-18deg);
      }
      46% {
        /* Whip snap follow-through jolt */
        transform: translate(-30px, 22px) scale(0.8, 1.25) rotate(14deg);
      }
      50% {
        /* Rebound wobble left */
        transform: translate(-18px, -10px) scale(1.14, 0.88) rotate(-9deg);
      }
      55% {
        /* Rebound wobble right */
        transform: translate(12px, 6px) scale(0.92, 1.1) rotate(6deg);
      }
      62% {
        /* Dazed dizzy tremble */
        transform: translate(-5px, 2px) scale(1.04, 0.96) rotate(-3deg);
      }
      72% {
        /* Shaking head clear */
        transform: translate(3px, -1px) scale(0.98, 1.02) rotate(1.5deg);
      }
      82%, 100% {
        transform: translate(0, 0) scale(1, 1) rotate(0deg);
      }
    }
    .dubly-character {
      animation: dubly-whip-reaction var(--cycle-time) cubic-bezier(0.2, 0.9, 0.3, 1) infinite;
      transform-origin: 440px 480px;
    }

    /* Dubly's 3-State Facial Expression Morph */
    /* State 1: Happy / anime wide eyes (0% - 32%, then restores at 80% - 100%) */
    @keyframes face-happy-anim {
      0%, 30% { opacity: 1; }
      33%, 78% { opacity: 0; }
      82%, 100% { opacity: 1; }
    }
    .face-happy { animation: face-happy-anim var(--cycle-time) infinite; }

    /* State 2: Anticipation terror / squint right before hit (32% - 43%) */
    @keyframes face-fear-anim {
      0%, 30% { opacity: 0; }
      32%, 42% { opacity: 1; }
      44%, 100% { opacity: 0; }
    }
    .face-fear { animation: face-fear-anim var(--cycle-time) infinite; }

    /* State 3: Dizzy / knocked out X_X eyes & red flushed cheeks (43% - 80%) */
    @keyframes face-dizzy-anim {
      0%, 42% { opacity: 0; }
      43.5%, 75% { opacity: 1; }
      80%, 100% { opacity: 0; }
    }
    .face-dizzy { animation: face-dizzy-anim var(--cycle-time) infinite; }

    /* Spinning dizzy stars on impact */
    @keyframes dizzy-stars-anim {
      0%, 43% { opacity: 0; transform: scale(0.2) rotate(0deg); }
      44% { opacity: 1; transform: scale(1.1) rotate(45deg); }
      58% { opacity: 0.9; transform: scale(1) rotate(180deg); }
      72% { opacity: 0; transform: scale(0.6) translateY(-25px) rotate(320deg); }
      100% { opacity: 0; }
    }
    .dizzy-stars {
      animation: dizzy-stars-anim var(--cycle-time) ease-out infinite;
      transform-origin: 440px 220px;
    }

    /* Dramatic Bullwhip Arm Motion: Coils high, violent forward lash, rapid recovery */
    @keyframes arm-strike-anim {
      0%, 12% {
        /* Resting cocked back position */
        transform: translate(30px, -20px) rotate(12deg);
      }
      26% {
        /* High coiled anticipation wind-up */
        transform: translate(65px, -70px) rotate(38deg);
      }
      38% {
        /* Violent forward thrust */
        transform: translate(-35px, 20px) rotate(-22deg);
      }
      43.5% {
        /* Full extension supersonic crack */
        transform: translate(-70px, 32px) rotate(-34deg);
      }
      50% {
        /* Snapback recoil */
        transform: translate(10px, -5px) rotate(4deg);
      }
      65%, 100% {
        transform: translate(30px, -20px) rotate(12deg);
      }
    }
    .whip-container {
      animation: arm-strike-anim var(--cycle-time) cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      transform-origin: 750px 70px;
    }

    /* Multi-stage Whip Lash Wave Morphing */
    @keyframes whip-idle-frame {
      0%, 14% { opacity: 1; }
      17%, 72% { opacity: 0; }
      76%, 100% { opacity: 1; }
    }
    @keyframes whip-wind-frame {
      0%, 14% { opacity: 0; }
      17%, 30% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }
    @keyframes whip-strike-frame {
      0%, 31% { opacity: 0; }
      34%, 41.5% { opacity: 1; }
      43.5%, 100% { opacity: 0; }
    }
    @keyframes whip-crack-frame {
      0%, 42% { opacity: 0; }
      43%, 48% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes whip-recoil-frame {
      0%, 48% { opacity: 0; }
      50%, 70% { opacity: 1; }
      74%, 100% { opacity: 0; }
    }
    .whip-idle-layer { animation: whip-idle-frame var(--cycle-time) infinite; }
    .whip-wind-layer { animation: whip-wind-frame var(--cycle-time) infinite; }
    .whip-strike-layer { animation: whip-strike-frame var(--cycle-time) infinite; }
    .whip-crack-layer { animation: whip-crack-frame var(--cycle-time) infinite; }
    .whip-recoil-layer { animation: whip-recoil-frame var(--cycle-time) infinite; }

    /* Explosive Comic Sound Burst Badge: WHIP-CRACK! */
    @keyframes crack-burst-badge {
      0%, 42% {
        opacity: 0;
        transform: scale(0.1) rotate(-18deg);
      }
      43.5% {
        opacity: 1;
        transform: scale(1.4) rotate(-8deg);
      }
      47% {
        transform: scale(1.08) rotate(3deg);
      }
      56% {
        opacity: 1;
        transform: scale(0.98) rotate(0deg);
      }
      66% {
        opacity: 0;
        transform: scale(0.7) translateY(-25px);
      }
      100% {
        opacity: 0;
        transform: scale(0.2);
      }
    }
    .comic-badge-anim {
      animation: crack-burst-badge var(--cycle-time) cubic-bezier(0.18, 0.89, 0.32, 1.28) infinite;
      transform-origin: 460px 175px;
    }

    /* Supersonic Shockwave Ring Burst */
    @keyframes sonic-boom-burst {
      0%, 42.5% {
        opacity: 0;
        transform: scale(0.15);
      }
      43.5% {
        opacity: 1;
        transform: scale(0.8);
      }
      52% {
        opacity: 0.9;
        transform: scale(1.85);
      }
      62%, 100% {
        opacity: 0;
        transform: scale(2.6);
      }
    }
    .sonic-shockwave {
      animation: sonic-boom-burst var(--cycle-time) ease-out infinite;
      transform-origin: 480px 245px;
    }

    /* Jagged Lightning Sparks & Speed Rays */
    @keyframes sparks-blast {
      0%, 42% { opacity: 0; transform: scale(0.2); }
      43.5% { opacity: 1; transform: scale(1.2); }
      49% { opacity: 0.8; transform: scale(1); }
      58%, 100% { opacity: 0; transform: scale(1.35); }
    }
    .sparks-group {
      animation: sparks-blast var(--cycle-time) ease-out infinite;
      transform-origin: 480px 245px;
    }

    /* Flying Sweat Drops */
    @keyframes sweat-flying {
      0%, 36% { opacity: 0; transform: translate(0, 0) scale(0.2); }
      38% { opacity: 1; transform: translate(-10px, -15px) scale(1); }
      45% { opacity: 0.9; transform: translate(-35px, -32px) scale(1.2); }
      54% { opacity: 0; transform: translate(-50px, -20px) scale(0.4); }
      100% { opacity: 0; }
    }
    .sweat-drop-anim {
      animation: sweat-flying var(--cycle-time) ease-out infinite;
    }

    /* Screen Flash Overlay on Crack */
    @keyframes flash-strobe {
      0%, 42.5% { opacity: 0; }
      43.5% { opacity: 0.45; }
      46% { opacity: 0.15; }
      48% { opacity: 0; }
      100% { opacity: 0; }
    }
    .screen-flash {
      animation: flash-strobe var(--cycle-time) ease-out infinite;
    }
</style>
</head>
